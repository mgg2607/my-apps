<!DOCTYPE html>
<html lang="en"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Zyn-Free Tracker</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;font-family:-apple-system,system-ui,Segoe UI,Roboto,sans-serif;background:#0f1115;color:#f2f2f2;padding:16px 12px 40px}
.top{position:sticky;top:0;background:#0f1115;padding:8px 0 12px;z-index:2;text-align:center}
.label{font-size:14px;color:#9aa3ad;letter-spacing:.5px;text-transform:uppercase}
.total{font-size:56px;font-weight:800;color:#3ddc84;line-height:1.1}
.sub{font-size:15px;color:#c8ced5;margin-top:4px}
.month{margin:22px 0 8px;font-size:20px;font-weight:700}
.grid{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.dow{text-align:center;font-size:12px;color:#7d8590;padding-bottom:2px}
.day{aspect-ratio:1;border:none;border-radius:12px;background:#1d2128;color:#e6e6e6;font-size:17px;font-weight:600;display:flex;flex-direction:column;align-items:center;justify-content:center;cursor:pointer}
.day.clean{background:#1f7a46;color:#fff}
.day.clean::after{content:"+$7";font-size:10px;font-weight:700;opacity:.9}
.day.ch{box-shadow:inset 0 -3px 0 #ffd166}
.day.today{outline:2px solid #3ddc84}
.day.future{background:transparent;color:#444;cursor:default}
.cd{margin:12px auto 0;max-width:360px;background:#1d2128;border-radius:14px;padding:10px 12px}.cdnum{font-size:34px;font-weight:800;color:#ffd166}.cdtxt{font-size:14px;color:#c8ced5}.cdsmall{font-size:12px;color:#9aa3ad;margin-top:6px}.bar{height:8px;background:#2b313a;border-radius:6px;margin-top:8px;overflow:hidden}#barfill{height:100%;width:0;background:#ffd166}
.truck{text-align:center;margin-bottom:6px}.truck img{width:100%;max-width:420px;border-radius:14px;display:block;margin:0 auto}.goal{font-weight:700;color:#ffd166;margin-top:6px;font-size:15px}.credit{font-size:10px;color:#666;margin-top:2px}
.blank{visibility:hidden}
.hint{text-align:center;color:#7d8590;font-size:13px;margin-top:22px}
.reset{display:block;margin:14px auto 0;background:none;border:1px solid #444;color:#9aa3ad;border-radius:8px;padding:8px 14px;font-size:13px}
</style></head><body>

const PER_DAY=7, KEY="zynFreeDays";
const START=new Date(2026,9,1);
let clean=new Set(JSON.parse(localStorage.getItem(KEY)||"[]"));
const key=d=>d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
function save(){localStorage.setItem(KEY,JSON.stringify([...clean]))}
function totals(){const n=clean.size;document.getElementById("total").textContent="$"+(n*PER_DAY).toLocaleString();document.getElementById("sub").textContent=n+" clean day"+(n===1?"":"s");countdown()}
const CH_START=new Date(2026,9,14),CH_DAYS=30;
function countdown(){const t=new Date();t.setHours(0,0,0,0);const day=Math.floor((t-CH_START)/864e5)+1;
 const end=new Date(2026,9,14+CH_DAYS-1);let left=Math.max(0,CH_DAYS-day);
 let inCh=0;for(let i=0;i<CH_DAYS;i++){const d=new Date(2026,9,14+i);if(clean.has(key(d)))inCh++}
 const n=document.getElementById("cdnum"),tx=document.getElementById("cdtxt");
 if(day>CH_DAYS){n.textContent="Done!";tx.textContent="30-day challenge complete";}
 else{n.textContent=left;tx.textContent=(left===1?"day":"days")+" left in your 30-day challenge (Day "+Math.max(1,day)+" of 30)";}
 document.getElementById("barfill").style.width=Math.min(100,Math.max(1,day)/CH_DAYS*100)+"%";
 document.getElementById("cdsmall").textContent="Ends "+end.toLocaleDateString("en-US",{month:"short",day:"numeric"})+" | "+inCh+" clean of 30 so far, $"+(inCh*PER_DAY)+" saved | Full 30 = $"+(CH_DAYS*PER_DAY);}
function render(){
  const cal=document.getElementById("cal");cal.innerHTML="";
  const today=new Date();today.setHours(0,0,0,0);
  const endMonth=new Date(Math.max(today,new Date(2026,10,12)));
  for(let m=new Date(START);m<=endMonth;m=new Date(m.getFullYear(),m.getMonth()+1,1)){
    const h=document.createElement("div");h.className="month";
    h.textContent=m.toLocaleString("en-US",{month:"long",year:"numeric"});cal.appendChild(h);
    const g=document.createElement("div");g.className="grid";
    "SMTWTFS".split("").forEach(c=>{const e=document.createElement("div");e.className="dow";e.textContent=c;g.appendChild(e)});
    for(let i=0;i<m.getDay();i++){const b=document.createElement("div");b.className="blank";g.appendChild(b)}
    const dim=new Date(m.getFullYear(),m.getMonth()+1,0).getDate();
    for(let d=1;d<=dim;d++){
      const dt=new Date(m.getFullYear(),m.getMonth(),d),k=key(dt);
      const b=document.createElement("button");b.className="day";b.textContent=d;
      if(dt>=CH_START&&dt<=new Date(2026,10,12))b.classList.add("ch");
      if(dt>today){b.classList.add("future");b.disabled=true}
      else{
        if(dt.getTime()===today.getTime())b.classList.add("today");
        if(clean.has(k))b.classList.add("clean");
        b.onclick=()=>{clean.has(k)?clean.delete(k):clean.add(k);save();b.classList.toggle("clean");totals()};
      }
      g.appendChild(b);
    }
    cal.appendChild(g);
  }
  totals();
}
document.getElementById("reset").onclick=()=>{if(confirm("Clear all clean days?")){clean.clear();save();render()}};
render();
</script></body></html>
